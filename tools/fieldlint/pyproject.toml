[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldlint"
version = "0.1.0"
description = "Physics-aware linter for PDE-surrogate benchmark datasets (steady diffusion / heat-type fields)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
h5 = ["h5py"]
mat = ["scipy", "h5py"]
yaml = ["pyyaml"]
all = ["h5py", "scipy", "pyyaml"]
test = ["pytest", "h5py", "scipy", "pyyaml"]

[project.scripts]
fieldlint = "fieldlint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fieldlint = ["presets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: needs external datasets on disk (skipped if absent)"]
