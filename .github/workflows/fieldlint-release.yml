# Build fieldlint's sdist and wheel; publish to TestPyPI or PyPI only when run by hand. Publishing uses PyPI trusted
# publishing (no token in the repo): register this repository, workflow file fieldlint-release.yml and environment
# testpypi / pypi as a trusted publisher on test.pypi.org and pypi.org first (tools/fieldlint/RELEASING.md).
name: fieldlint-release
on:
  push:
    tags: ["fieldlint-v*"]
  workflow_dispatch:
    inputs:
      target:
        description: where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/fieldlint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: The tag matches the package version
        if: startsWith(github.ref, 'refs/tags/fieldlint-v')
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "fieldlint-v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - name: The built wheel installs and runs
        run: |
          python -m pip install dist/*.whl
          cd /tmp && fieldlint --version && fieldlint-labelswap --help > /dev/null
      - uses: actions/upload-artifact@v4
        with: {name: fieldlint-dist, path: tools/fieldlint/dist/}

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: fieldlint-dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
