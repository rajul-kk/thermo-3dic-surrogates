name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt httpx
      - name: tests (data, 3D-ICE, HotSpot and GPU tests skip themselves)
        run: pytest tests -rs -p no:cacheprovider

  iceforge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -e "tools/iceforge[test,yaml,diff]"
      - name: iceforge tests (solver tests skip without a 3D-ICE backend)
        run: pytest tools/iceforge/tests -rs -p no:cacheprovider
